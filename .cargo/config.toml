[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))']
# Candle 0.11.0's Apple Silicon NEON fp16 path uses unstable stdarch types on
# stable Rust. Disable the CPU fp16 target feature so crates.io Candle uses its
# stable fallback while Metal acceleration remains available on macOS 15+. The matching
# gemm-f16 dev-profile override in Cargo.toml keeps debug/test codegen valid.
rustflags = ["-C", "target-feature=-fp16"]
