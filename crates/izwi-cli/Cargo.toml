[package]
name = "izwi-cli"
description = "World-class CLI for Izwi audio inference engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "izwi"
path = "src/main.rs"

[dependencies]

# CLI framework
clap = { version = "4.5", features = [
    "derive",
    "env",
    "cargo",
    "wrap_help",
    "unicode",
] }
clap_complete = "4.5"

# Async runtime
tokio = { workspace = true }
izwi-env = { path = "../izwi-env" }
tokio-stream = { workspace = true }
futures = { workspace = true }

# HTTP client for API calls
reqwest = { workspace = true, features = ["json", "stream", "multipart"] }
rustls = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

# Rich terminal UI
console = "0.16"
indicatif = { workspace = true }
dialoguer = "0.12"
comfy-table = "8"

# Progress and streaming
bytes = { workspace = true }

# Error handling
anyhow = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Utilities
base64 = "0.23"
rustc_version_runtime = "0.3"
chrono = { version = "0.4", features = ["serde"] }
url = "2.5"
humansize = "2.1"

[features]
default = []
cuda-base = ["izwi-core/cuda"]
cudnn-base = ["cuda-base", "izwi-core/cudnn"]
cuda = ["cuda-base", "izwi-core/flash-attn"]
cudnn = ["cuda", "izwi-core/cudnn"]
flash-attn = ["cuda"]
metal = ["izwi-core/metal"]

[target.'cfg(target_os = "macos")'.dependencies]
izwi-core = { path = "../izwi-core", default-features = false, features = ["accelerate"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
izwi-core = { path = "../izwi-core", default-features = false }

[dev-dependencies]
tokio-test = "0.4"
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.10"
