[package]
name = "izwi-serving-worker"
description = "Private inference worker HTTP service for Izwi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# The same backend vocabulary as izwi-server, enabling the same izwi-core
# features (check-serving-boundary.sh asserts it): `cuda` includes
# FlashAttention, `cuda-base` is CUDA without it, and macOS always links
# Accelerate through the target-specific dependency below.
[features]
default = []
cuda-base = ["izwi-core/cuda"]
cudnn-base = ["cuda-base", "izwi-core/cudnn"]
cuda = ["cuda-base", "izwi-core/flash-attn"]
cudnn = ["cuda", "izwi-core/cudnn"]
flash-attn = ["cuda"]
metal = ["izwi-core/metal"]
# A real worker over a scripted runtime, for contract and gateway tests.
test-support = []

[dependencies]
anyhow = { workspace = true }
izwi-env = { path = "../izwi-env" }
async-stream = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true, features = ["http2"] }
bytes = { workspace = true }
dirs = { workspace = true }
futures = { workspace = true }
izwi-serving-client = { path = "../izwi-serving-client" }
izwi-serving-fence = { path = "../izwi-serving-fence" }
izwi-serving-protocol = { path = "../izwi-serving-protocol" }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
izwi-core = { path = "../izwi-core", default-features = false, features = ["accelerate"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
izwi-core = { path = "../izwi-core", default-features = false }

[dev-dependencies]
candle-core = { workspace = true }
half = { workspace = true }
sha2 = { workspace = true }
izwi-serving-worker = { path = ".", features = ["test-support"] }
izwi-hooks = { path = "../izwi-hooks" }
izwi-server = { path = "../izwi-server" }
izwi-serving-supervisor = { path = "../izwi-serving-supervisor" }
izwi-test-process = { path = "../izwi-test-process" }
reqwest = { workspace = true }
rustls = { workspace = true }
safetensors = { workspace = true }
tempfile = "3.10"
tokenizers = { workspace = true }
tower = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tokio-tungstenite = "0.29"
