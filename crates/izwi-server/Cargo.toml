[package]
name = "izwi-server"
description = "HTTP API server for Izwi TTS inference engine"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "izwi-server"
path = "src/main.rs"

[features]
default = []
cuda-base = ["izwi-core/cuda"]
cudnn-base = ["cuda-base", "izwi-core/cudnn"]
cuda = ["cuda-base", "izwi-core/flash-attn"]
cudnn = ["cuda", "izwi-core/cudnn"]
flash-attn = ["cuda"]
metal = ["izwi-core/metal"]
db-mysql = ["sea-orm/sqlx-mysql"]
db-postgres = ["sea-orm/sqlx-postgres"]

[dependencies]
tempfile = "3.10"
fs2 = "0.4.3"
tokio = { workspace = true }
tokio-stream = { workspace = true }
futures = { workspace = true }
async-stream = { workspace = true }

axum = { workspace = true }
axum-extra = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
utoipa = { workspace = true }
scalar_api_reference = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
sha2 = { workspace = true }

anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
bytes = { workspace = true }
base64 = { workspace = true }
hound = { workspace = true }
clap = { version = "4.5", features = ["derive", "env"] }
async-trait = "0.1"
izwi-hooks = { path = "../izwi-hooks" }
izwi-agent = { path = "../izwi-agent" }
izwi-vad = { path = "../izwi-vad" }
izwi-serving-client = { path = "../izwi-serving-client" }
izwi-serving-protocol = { path = "../izwi-serving-protocol" }

config = { workspace = true }
dirs = { workspace = true }
sea-orm = { version = "=2.0.0-rc.38", default-features = false, features = [
    "macros",
    "runtime-tokio",
    "sqlx-sqlite",
    "sqlite-use-returning-for-3_35",
    "with-json",
    "with-uuid",
] }

[target.'cfg(target_os = "macos")'.dependencies]
izwi-core = { path = "../izwi-core", default-features = false, features = ["accelerate"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
izwi-core = { path = "../izwi-core", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
izwi-serving-client = { path = "../izwi-serving-client", features = ["mock-worker"] }
