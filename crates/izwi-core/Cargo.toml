[package]
name = "izwi-core"
description = "Core TTS inference engine for Qwen3-TTS models on Apple Silicon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
izwi-asr-toolkit = { path = "../izwi-asr-toolkit" }
izwi-env = { path = "../izwi-env" }
izwi-model-catalog = { path = "../izwi-model-catalog" }
izwi-prometheus = { path = "../izwi-prometheus" }
izwi-vad = { path = "../izwi-vad" }

tokio = { workspace = true }
tokio-stream = { workspace = true }
futures = { workspace = true }
async-stream = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
# serde_yaml is archived; yaml_serde is the YAML organization's maintained fork
# with the same API.
serde_yaml = { package = "yaml_serde", version = "0.10" }
toml = { workspace = true }

safetensors = { workspace = true }
tokenizers = { workspace = true }
tekken = { package = "tekken-rs", version = "0.1.1" }
candle-core = { workspace = true }
candle-nn = { workspace = true }
candle-transformers = { workspace = true }
half = { workspace = true }
candle-flash-attn = { version = "0.11.0", optional = true }
# The K-quant MMVQ launchers behind candle-core's QMatMul (kernels/cuda/kquant.rs).
candle-kernels = { version = "=0.11.0", optional = true }
candle-metal-kernels = { version = "0.11.0", optional = true }
objc2 = { version = "0.6.3", optional = true }
objc2-metal = { version = "0.3.2", optional = true }
cudarc = { version = "0.19.8", optional = true, default-features = false, features = ["cuda-version-from-build-system", "driver"] }

hound = { workspace = true }
symphonia = { workspace = true, default-features = false, features = [
    "all-formats",
    "all-codecs",
] }
rubato = { workspace = true }
rustfft = { workspace = true }
# PyTorch .pt/.pth archives (Kokoro voices, weights) are read by member name and
# store their entries uncompressed; deflate is the only codec kept.
zip = { version = "9", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"
rand = "0.10"
rand_chacha = "0.10"
rand_distr = "0.6"
rayon = "1.11"
regex = "1.12"
# Chatterbox's Chinese frontend: Unicode general categories, and the
# MessagePack feature table of its pkuseg segmenter.
icu_properties = "2.3"
rmp-serde = "1.3"

anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
bytes = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
indicatif = { workspace = true }
dirs = { workspace = true }
base64 = { workspace = true }
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "webp",
    "bmp",
] }
memmap2 = { workspace = true }
# Free and total disk space (std has no statvfs).
fs4 = { version = "1.1", default-features = false }
sha2 = { workspace = true }
hex = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.3", features = ["fs"] }

[features]
default = []
cuda = [
    "candle-core/cuda",
    "candle-nn/cuda",
    "candle-transformers/cuda",
    "dep:candle-kernels",
    "dep:cudarc",
]
cudnn = [
    "cuda",
    "candle-core/cudnn",
    "candle-nn/cudnn",
    "candle-transformers/cudnn",
    "candle-flash-attn?/cudnn",
]
metal = [
    "candle-core/metal",
    "candle-nn/metal",
    "candle-transformers/metal",
    "dep:candle-metal-kernels",
    "dep:objc2",
    "dep:objc2-metal",
]
flash-attn = ["cuda", "dep:candle-flash-attn", "candle-transformers/flash-attn"]
accelerate = [
    "candle-core/accelerate",
    "candle-nn/accelerate",
    "candle-transformers/accelerate",
]

# Note: Direct Metal access is available via feature flags.
# Currently all Metal functionality is provided through Candle's abstraction.

[dev-dependencies]
tokio-test = "0.4"
izwi-vad = { path = "../izwi-vad", features = ["test-signals"] }

[build-dependencies]
cudaforge = "0.1.5"
