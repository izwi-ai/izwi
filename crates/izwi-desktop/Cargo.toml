[package]
name = "izwi-desktop"
description = "Tauri desktop shell for Izwi local inference server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "izwi-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
clap = { version = "4.5", features = ["derive"] }
anyhow = { workspace = true }
url = "2.5"
percent-encoding = "2.3"
# Keep the minor version in step with @tauri-apps/api in ui/package-lock.json:
# `cargo tauri build` fails when they differ.
tauri = { version = "2.12.5", features = ["tray-icon"] }
# Its default TLS feature turns on reqwest's aws-lc-rs provider next to ring.
# Without it the plugin shares the reqwest rustls stack, with the ring provider
# that main installs.
tauri-plugin-aptabase = { version = "1.3.0", default-features = false }
tauri-plugin-autostart = "2.7.0"
# Native save and error dialogs.
tauri-plugin-dialog = "2.8.3"
tauri-plugin-process = "2.4.0"
tauri-plugin-single-instance = "2.5.4"
tauri-plugin-updater = "2.14.0"
# Keep the Aptabase reqwest proxy stack on a sandbox-safe macOS line.
hyper-util = "0.1.20"
reqwest = { workspace = true }
rustls = { workspace = true }
semver = "1.0"
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
izwi-env = { path = "../izwi-env" }
