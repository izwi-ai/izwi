name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  versions:
    name: Check versions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # The tag, the workspace version and the UI package must agree: the
      # updater compares them, and the desktop app takes Cargo's version
      # (tauri.conf.json carries none).
      - name: Tag, Cargo and package.json versions match
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          cargo_version="$(awk '/^\[workspace.package\]/{f=1;next} /^\[/{f=0} f && /^version *=/{gsub(/[" ]/,"",$0); sub(/version=/,"",$0); print; exit}' Cargo.toml)"
          ui_version="$(jq -r '.version' ui/package.json)"
          echo "tag=${tag_version} cargo=${cargo_version} ui=${ui_version}"
          if [ "$tag_version" != "$cargo_version" ] || [ "$tag_version" != "$ui_version" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match Cargo.toml (${cargo_version}) and ui/package.json (${ui_version})."
            exit 1
          fi
          if jq -e 'has("version")' crates/izwi-desktop/tauri.conf.json > /dev/null; then
            echo "::error::tauri.conf.json sets a version; it must inherit Cargo's."
            exit 1
          fi

  build:
    name: Build (${{ matrix.os }})
    needs: versions
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_suffix: linux-x86_64
            bundle_kind: deb
            bundle_ext: deb
          - os: windows-latest
            asset_suffix: windows-x86_64
            bundle_kind: nsis
            bundle_ext: exe
          - os: macos-15
            asset_suffix: macos
            bundle_kind: dmg
            bundle_ext: dmg
    env:
      # Kept at job scope for step conditions only.
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APTABASE_APP_KEY: ${{ secrets.APTABASE_APP_KEY }}
      IZWI_UPDATER_PUBKEY: ${{ secrets.IZWI_UPDATER_PUBKEY }}
      # The updater signing key is deliberately NOT job-scoped: it is passed
      # only to the steps that validate it or run `cargo tauri build`, so npm
      # lifecycle scripts, tests and other build steps never see it.

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Every release is signed for the updater: stable builds follow
      # latest.json, prereleases latest-beta.json.
      - name: Validate updater signing inputs
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "${IZWI_UPDATER_PUBKEY}" ]; then
            echo "::error::Missing IZWI_UPDATER_PUBKEY secret."
            exit 1
          fi
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]; then
            echo "::error::Missing TAURI_SIGNING_PRIVATE_KEY secret."
            exit 1
          fi
          if [[ "${IZWI_UPDATER_PUBKEY}" == \$* ]]; then
            echo "::error::IZWI_UPDATER_PUBKEY looks like an unresolved placeholder ('${IZWI_UPDATER_PUBKEY}')."
            exit 1
          fi
          if [[ "${TAURI_SIGNING_PRIVATE_KEY}" == \$* ]]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY looks like an unresolved placeholder."
            exit 1
          fi

      - name: Install Linux dependencies for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Inject updater pubkey into Tauri config
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'crates/izwi-desktop/tauri.conf.json';
          const pubkey = (process.env.IZWI_UPDATER_PUBKEY || '').trim();
          if (!pubkey) {
            throw new Error('IZWI_UPDATER_PUBKEY is empty after trimming.');
          }
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));
          config.plugins = config.plugins || {};
          config.plugins.updater = config.plugins.updater || {};
          config.plugins.updater.pubkey = pubkey;
          fs.writeFileSync(path, `${JSON.stringify(config, null, 2)}\n`);
          NODE

      - name: Setup Rust toolchain
        # Pinned: a new stable release can add clippy lints that fail
        # `-D warnings` with no repo change. Bump deliberately, together
        # with the version the lanes are verified with locally. No
        # rust-toolchain.toml: it would override the 1.88.0 (MSRV) CUDA
        # compile lanes, which install that version as the rustup default.
        uses: dtolnay/rust-toolchain@ff7f6a3374ce205788da40198ec918bd5d67aea7 # 1.99.0

      # The workspace .cargo/config.toml sets an extensionless python
      # rustc-wrapper that only matters to Apple's linker. Windows cannot
      # execute it, and an empty RUSTC_WRAPPER overrides the configured one
      # for every later cargo call, including `cargo tauri build`.
      - name: Disable the macOS rustc wrapper (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            . -> target

      - name: Install UI dependencies (for Tauri beforeBuildCommand)
        run: npm ci --prefix ui

      - name: Lint UI
        run: npm --prefix ui run lint

      - name: Test UI
        run: npm --prefix ui test

      - name: Build UI dist (required by izwi-desktop compile-time Tauri config)
        run: npm --prefix ui run build

      - name: Build CLI, gateway, supervisor, and worker binaries (Linux/Windows)
        if: runner.os != 'macOS'
        run: |
          # izwi-desktop bundles izwi/izwi-server as resources, so build those first.
          # Native Linux/Windows serving workers remain CPU-only. izwi-server and
          # the standalone izwi-gateway (no inference engine) ship with
          # PostgreSQL support (IZWI_DATABASE_URL=postgres://...).
          cargo build --release --bin izwi --bin izwi-server --bin izwi-gateway --bin izwi-serving-supervisor --bin izwi-serving-worker --features izwi-server/db-postgres,izwi-gateway/db-postgres

      - name: Build CLI, gateway, supervisor, and worker binaries (macOS 15+ Metal, macOS 12 deployment)
        if: runner.os == 'macOS'
        env:
          MACOSX_DEPLOYMENT_TARGET: "12.0"
        run: |
          cargo build --release -p izwi-cli --features metal
          cargo build --release -p izwi-server --features metal,db-postgres
          cargo build --release -p izwi-gateway --features db-postgres
          cargo build --release -p izwi-serving-supervisor
          cargo build --release -p izwi-serving-worker --features metal

      - name: Build desktop binary
        env:
          MACOSX_DEPLOYMENT_TARGET: "12.0"
        run: |
          cargo build --release --bin izwi-desktop

      - name: Verify macOS binary deployment floor
        if: runner.os == 'macOS'
        run: |
          for binary in target/release/izwi target/release/izwi-server target/release/izwi-gateway target/release/izwi-serving-supervisor target/release/izwi-serving-worker target/release/izwi-desktop; do
            minos="$(otool -l "$binary" | awk '/LC_BUILD_VERSION/ { found=1; next } found && /minos/ { print $2; exit }')"
            if [[ "$minos" != "12.0" ]]; then
              echo "::error::$binary has deployment floor '$minos', expected 12.0."
              exit 1
            fi
          done

      - name: Package terminal binaries (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir -p release-assets
          tar -czf "release-assets/izwi-cli-${{ github.ref_name }}-${{ matrix.asset_suffix }}.tar.gz" \
            -C "${{ github.workspace }}/target/release" \
            izwi izwi-server izwi-gateway izwi-serving-supervisor izwi-serving-worker izwi-desktop \
            -C "${{ github.workspace }}/config/serving" \
            izwi-serving-node.example.toml

      - name: Package terminal binaries (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Compress-Archive -Path `
            target/release/izwi.exe, `
            target/release/izwi-server.exe, `
            target/release/izwi-gateway.exe, `
            target/release/izwi-serving-supervisor.exe, `
            target/release/izwi-serving-worker.exe, `
            config/serving/izwi-serving-node.example.toml, `
            target/release/izwi-desktop.exe `
            -DestinationPath "release-assets/izwi-cli-${{ github.ref_name }}-${{ matrix.asset_suffix }}.zip" `
            -Force

      - name: Include macOS uninstall helper
        if: runner.os == 'macOS'
        run: |
          mkdir -p release-assets
          cp scripts/uninstall-macos.sh "release-assets/uninstall-izwi-macos.sh"

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked --version "^2.0"

      - name: Build desktop bundle (Linux)
        if: runner.os == 'Linux'
        env:
          CI: "true"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          cargo tauri build \
            --bundles deb,appimage

      - name: Build desktop bundle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CI: "true"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          cargo tauri build --bundles ${{ matrix.bundle_kind }}

      # Without the Apple secrets, any release (stable included) ships a macOS
      # build that is not notarized: first launch needs Open Anyway in
      # Privacy & Security (docs/user/installation/macos.md).
      - name: Build desktop bundle (unsigned macOS)
        if: runner.os == 'macOS' && env.APPLE_SIGNING_IDENTITY == ''
        env:
          CI: "true"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          MACOSX_DEPLOYMENT_TARGET: "12.0"
        run: |
          echo "::warning::No Apple signing secrets: this macOS build is not signed with a Developer ID or notarized."
          env -u APPLE_SIGNING_IDENTITY \
            -u APPLE_CERTIFICATE \
            -u APPLE_CERTIFICATE_PASSWORD \
            -u APPLE_ID \
            -u APPLE_PASSWORD \
            -u APPLE_TEAM_ID \
            cargo tauri build \
            --bundles app,${{ matrix.bundle_kind }} \
            --config crates/izwi-desktop/tauri.macos.conf.json

      - name: Build desktop bundle (signed macOS)
        if: runner.os == 'macOS' && env.APPLE_SIGNING_IDENTITY != ''
        env:
          CI: "true"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          MACOSX_DEPLOYMENT_TARGET: "12.0"
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cargo tauri build \
            --bundles app,${{ matrix.bundle_kind }} \
            --config crates/izwi-desktop/tauri.macos.conf.json

      - name: Verify macOS bundle deployment floor
        if: runner.os == 'macOS'
        run: |
          app_path="$(find target crates/izwi-desktop/target -type d -path '*/release/bundle/macos/*.app' | head -n 1)"
          if [[ -z "$app_path" ]]; then
            echo "::error::Could not find the built macOS app bundle."
            exit 1
          fi
          minos="$(plutil -extract LSMinimumSystemVersion raw -o - "$app_path/Contents/Info.plist")"
          if [[ "$minos" != "12.0" ]]; then
            echo "::error::$app_path has LSMinimumSystemVersion '$minos', expected 12.0."
            exit 1
          fi

      - name: Collect updater artifacts (Linux)
        if: runner.os == 'Linux'
        run: |
          appimage_path="$(
            (
              find target -type f -path "*/release/bundle/appimage/*.AppImage" 2>/dev/null
              find crates/izwi-desktop/target -type f -path "*/release/bundle/appimage/*.AppImage" 2>/dev/null
            ) | head -n 1
          )"
          if [ -z "$appimage_path" ]; then
            echo "Could not find AppImage updater bundle."
            exit 1
          fi
          sig_path="${appimage_path}.sig"
          if [ ! -f "$sig_path" ]; then
            echo "Could not find AppImage updater signature at $sig_path."
            exit 1
          fi
          cp "$appimage_path" release-assets/
          cp "$sig_path" release-assets/

      - name: Collect updater artifacts (macOS)
        if: runner.os == 'macOS'
        run: |
          updater_bundle="$(
            (
              find target -type f -path "*/release/bundle/macos/*.app.tar.gz" 2>/dev/null
              find crates/izwi-desktop/target -type f -path "*/release/bundle/macos/*.app.tar.gz" 2>/dev/null
            ) | head -n 1
          )"
          if [ -z "$updater_bundle" ]; then
            echo "Could not find macOS updater bundle (.app.tar.gz)."
            exit 1
          fi
          sig_path="${updater_bundle}.sig"
          if [ ! -f "$sig_path" ]; then
            echo "Could not find macOS updater signature at $sig_path."
            exit 1
          fi
          cp "$updater_bundle" release-assets/
          cp "$sig_path" release-assets/

      - name: Collect updater artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $preferredDirPattern = '[\\/]release[\\/]bundle[\\/]nsis[\\/]'
          $fallbackDirPattern = '[\\/]release[\\/]bundle[\\/]nsis-updater[\\/]'

          $candidates = Get-ChildItem -Path "target","crates/izwi-desktop/target" -Recurse -File |
            Where-Object {
              $_.Name -match '-setup\.exe$' -and
              (
                $_.FullName -match $preferredDirPattern -or
                $_.FullName -match $fallbackDirPattern
              )
            }

          $updaterBundle = $candidates |
            Sort-Object `
              @{ Expression = { $_.FullName -match $preferredDirPattern }; Descending = $true }, `
              @{ Expression = "LastWriteTime"; Descending = $true } |
            Select-Object -First 1

          if (-not $updaterBundle) {
            Write-Host "Discovered setup executables:"
            Get-ChildItem -Path "target","crates/izwi-desktop/target" -Recurse -File |
              Where-Object { $_.Name -match '-setup\.exe$' } |
              Select-Object -ExpandProperty FullName
            throw "Could not find Windows updater bundle (setup.exe) in nsis/nsis-updater."
          }

          $signaturePath = "$($updaterBundle.FullName).sig"
          if (-not (Test-Path $signaturePath)) {
            throw "Could not find Windows updater signature at $signaturePath."
          }

          Copy-Item $signaturePath -Destination release-assets

      - name: Collect desktop bundle artifact (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          bundle_path="$(
            (
              find target -type f \
                -path "*/release/bundle/${{ matrix.bundle_kind }}/*.${{ matrix.bundle_ext }}" 2>/dev/null
              find crates/izwi-desktop/target -type f \
                -path "*/release/bundle/${{ matrix.bundle_kind }}/*.${{ matrix.bundle_ext }}" 2>/dev/null
            ) | head -n 1
          )"
          if [ -z "$bundle_path" ]; then
            echo "Could not find desktop bundle for ${{ matrix.bundle_kind }}."
            exit 1
          fi
          cp "$bundle_path" release-assets/
          # A signed .deb lets a .deb install update itself (linux-deb).
          if [ -f "${bundle_path}.sig" ]; then
            cp "${bundle_path}.sig" release-assets/
          fi

      - name: Collect desktop bundle artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $preferredDirPattern = '[\\/]release[\\/]bundle[\\/]nsis[\\/]'
          $fallbackDirPattern = '[\\/]release[\\/]bundle[\\/]nsis-updater[\\/]'

          $bundleCandidates = Get-ChildItem -Path "target","crates/izwi-desktop/target" -Recurse -File |
            Where-Object {
              $_.Name -match '-setup\.exe$' -and
              (
                $_.FullName -match $preferredDirPattern -or
                $_.FullName -match $fallbackDirPattern
              )
            }

          $bundle = $bundleCandidates |
            Sort-Object `
              @{ Expression = { $_.FullName -match $preferredDirPattern }; Descending = $true }, `
              @{ Expression = "LastWriteTime"; Descending = $true } |
            Select-Object -First 1

          if (-not $bundle) {
            throw "Could not find desktop bundle for ${{ matrix.bundle_kind }} (setup.exe in nsis/nsis-updater)."
          }

          Copy-Item $bundle.FullName -Destination release-assets

      - name: Verify native release artifacts (Linux/macOS)
        if: runner.os != 'Windows'
        run: scripts/release/verify-native-artifacts.sh --artifact-dir release-assets

      - name: Verify native release artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/release/verify-native-artifacts.ps1 -ArtifactDir release-assets

      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.asset_suffix }}
          path: release-assets/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Download built artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Show release files
        run: ls -lah dist

      - name: Verify downloaded native release artifacts
        run: scripts/release/verify-native-artifacts.sh --artifact-dir dist

      - name: Generate release support note
        run: |
          cat > release-support.md <<'EOF'
          ## Runtime Support

          - macOS native artifacts use Metal on Apple Silicon with macOS 15 or later and fall back to CPU on macOS 12-14.
          - Linux and Windows native artifacts are CPU-only and intentionally do not bundle CUDA runtime libraries.
          - Terminal archives include `izwi-server`, the standalone `izwi-gateway` (the preferred gateway: it links no inference engine; `izwi-server --role gateway` still works), the CPU-only `izwi-serving-supervisor`, one backend-appropriate `izwi-serving-worker`, and a bounded single-node configuration example.
          - The packaged supervisor accepts explicit CPU inventory only. Metal/CUDA supervisor inventory and launch profiles remain fail-closed and are release blockers for those supervised lanes.
          - NVIDIA CUDA is supported through the Docker `production-cuda` target / `docker compose --profile cuda` and through source builds with `--features cuda`.
          - Native artifacts are checked for CUDA runtime payloads and per-file size before release publication.
          EOF

      - name: Generate updater manifest
        run: |
          # Stable tags publish latest.json; prereleases latest-beta.json.
          if [[ "${{ github.ref_name }}" == *-* ]]; then
            manifest="dist/latest-beta.json"
          else
            manifest="dist/latest.json"
          fi
          echo "UPDATER_MANIFEST=${manifest}" >> "$GITHUB_ENV"

          linux_bundle="$(find dist -maxdepth 1 -type f -name '*.AppImage' | head -n 1)"
          macos_bundle="$(find dist -maxdepth 1 -type f -name '*.app.tar.gz' | head -n 1)"
          windows_bundle="$(find dist -maxdepth 1 -type f -name '*-setup.exe' | head -n 1)"
          deb_bundle="$(find dist -maxdepth 1 -type f -name '*.deb' | head -n 1)"

          if [ -z "$linux_bundle" ] || [ -z "$macos_bundle" ] || [ -z "$windows_bundle" ]; then
            echo "::error::Missing updater bundles in dist/."
            exit 1
          fi

          for bundle in "$linux_bundle" "$macos_bundle" "$windows_bundle"; do
            if [ ! -f "${bundle}.sig" ]; then
              echo "::error::Missing updater signature ${bundle}.sig."
              exit 1
            fi
          done

          base_url="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}"
          entry() {
            jq -n --arg url "${base_url}/$(basename "$1")" --arg signature "$(tr -d '\r\n' < "$1.sig")" \
              '{url: $url, signature: $signature}'
          }
          platforms="$(jq -n \
            --argjson linux "$(entry "$linux_bundle")" \
            --argjson macos "$(entry "$macos_bundle")" \
            --argjson windows "$(entry "$windows_bundle")" \
            '{linux: $linux, macos: $macos, windows: $windows}')"
          # A .deb install updates with the .deb when the build signed it.
          if [ -n "$deb_bundle" ] && [ -f "${deb_bundle}.sig" ]; then
            platforms="$(jq --argjson deb "$(entry "$deb_bundle")" '. + {"linux-deb": $deb}' <<< "$platforms")"
          else
            echo "::warning::No signed .deb in dist/: .deb installs get no in-app update for this release."
          fi

          jq -n \
            --arg version "${{ github.ref_name }}" \
            --arg notes "Izwi ${{ github.ref_name }}" \
            --arg pub_date "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" \
            --argjson platforms "$platforms" \
            '{version: $version, notes: $notes, pub_date: $pub_date, platforms: $platforms}' > "$manifest"
          cat "$manifest"

      - name: Validate updater manifest
        run: |
          jq -e '.version and .platforms.linux.url and .platforms.linux.signature and .platforms.macos.url and .platforms.macos.signature and .platforms.windows.url and .platforms.windows.signature' "$UPDATER_MANIFEST" > /dev/null

      - name: Enforce updater asset matrix consistency
        run: |
          version="$(jq -r '.version' "$UPDATER_MANIFEST")"
          if [ "$version" != "${{ github.ref_name }}" ]; then
            echo "::error::$(basename "$UPDATER_MANIFEST") version ($version) does not match tag (${{ github.ref_name }})."
            exit 1
          fi

          jq -r '.platforms | to_entries[] | [.key, .value.url, .value.signature] | @tsv' "$UPDATER_MANIFEST" | \
          while IFS=$'\t' read -r platform_key asset_url signature; do
            if [ -z "$signature" ] || [ "$signature" = "null" ]; then
              echo "::error::Missing signature for platform $platform_key."
              exit 1
            fi
            if [ "${#signature}" -lt 64 ]; then
              echo "::error::Signature for platform $platform_key looks too short."
              exit 1
            fi

            asset_name="$(basename "$asset_url")"
            if [ ! -f "dist/$asset_name" ]; then
              echo "::error::Manifest points to missing asset dist/$asset_name for platform $platform_key."
              exit 1
            fi
          done

      - name: Create release and upload assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: Izwi ${{ github.ref_name }}
          body_path: release-support.md
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist/*
