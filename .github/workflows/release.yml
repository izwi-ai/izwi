name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Read-only by default; only the publish job writes the release.
permissions:
  contents: read

jobs:
  versions:
    name: Check versions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The tag, the workspace version and the UI package must agree: the
      # updater compares them, and the desktop app takes Cargo's version
      # (tauri.conf.json carries none).
      - name: Tag, Cargo and package.json versions match
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          cargo_version="$(awk '/^\[workspace.package\]/{f=1;next} /^\[/{f=0} f && /^version *=/{gsub(/[" ]/,"",$0); sub(/version=/,"",$0); print; exit}' Cargo.toml)"
          ui_version="$(jq -r '.version' ui/package.json)"
          echo "tag=${tag_version} cargo=${cargo_version} ui=${ui_version}"
          if [ "$tag_version" != "$cargo_version" ] || [ "$tag_version" != "$ui_version" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match Cargo.toml (${cargo_version}) and ui/package.json (${ui_version})."
            exit 1
          fi
          if jq -e 'has("version")' crates/izwi-desktop/tauri.conf.json > /dev/null; then
            echo "::error::tauri.conf.json sets a version; it must inherit Cargo's."
            exit 1
          fi

  build:
    name: Build (${{ matrix.os }})
    needs: versions
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_suffix: linux-x86_64
            bundle_kind: deb
            bundle_ext: deb
          - os: windows-latest
            asset_suffix: windows-x86_64
            bundle_kind: nsis
            bundle_ext: exe
          - os: macos-15
            asset_suffix: macos
            bundle_kind: dmg
            bundle_ext: dmg
    env:
      # Kept at job scope for step conditions only.
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APTABASE_APP_KEY: ${{ secrets.APTABASE_APP_KEY }}
      IZWI_UPDATER_PUBKEY: ${{ secrets.IZWI_UPDATER_PUBKEY }}
      # The updater signing key is deliberately NOT job-scoped: it is passed
      # only to the steps that validate it or run `cargo tauri build`, so npm
      # lifecycle scripts, tests and other build steps never see it.

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Every release is signed for the updater: stable builds follow
      # latest.json, prereleases latest-beta.json.
      - name: Validate updater signing inputs
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "${IZWI_UPDATER_PUBKEY}" ]; then
            echo "::error::Missing IZWI_UPDATER_PUBKEY secret."
            exit 1
          fi
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]; then
            echo "::error::Missing TAURI_SIGNING_PRIVATE_KEY secret."
            exit 1
          fi
          if [[ "${IZWI_UPDATER_PUBKEY}" == \$* ]]; then
            echo "::error::IZWI_UPDATER_PUBKEY looks like an unresolved placeholder ('${IZWI_UPDATER_PUBKEY}')."
            exit 1
          fi
          if [[ "${TAURI_SIGNING_PRIVATE_KEY}" == \$* ]]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY looks like an unresolved placeholder."
            exit 1
          fi

      - name: Install Linux dependencies for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Inject updater pubkey into Tauri config
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'crates/izwi-desktop/tauri.conf.json';
          const pubkey = (process.env.IZWI_UPDATER_PUBKEY || '').trim();
          if (!pubkey) {
            throw new Error('IZWI_UPDATER_PUBKEY is empty after trimming.');
          }
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));
          config.plugins = config.plugins || {};
          config.plugins.updater = config.plugins.updater || {};
          config.plugins.updater.pubkey = pubkey;
          fs.writeFileSync(path, `${JSON.stringify(config, null, 2)}\n`);
          NODE

      - name: Setup Rust toolchain
        # Pinned: a new stable release can add clippy lints that fail
        # `-D warnings` with no repo change. Bump deliberately, together
        # with the workspace rust-version, the Dockerfile builders and the
        # CUDA compile lanes, which all use this same version.
        uses: dtolnay/rust-toolchain@ff7f6a3374ce205788da40198ec918bd5d67aea7 # 1.99.0
        with:
          # macOS release builds strip with rust-objcopy, which since 1.98
          # loads libLLVM.dylib from a directory only llvm-tools populates
          # (rust-lang/rust#164063). Without it stripping fails with a
          # warning and the binaries ship with their debuginfo.
          components: llvm-tools

      # The workspace .cargo/config.toml sets an extensionless python
      # rustc-wrapper that only matters to Apple's linker. Windows cannot
      # execute it, and an empty RUSTC_WRAPPER overrides the configured one
      # for every later cargo call, including `cargo tauri build`.
      - name: Disable the macOS rustc wrapper (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            . -> target

      - name: Install UI dependencies (for Tauri beforeBuildCommand)
        run: npm ci --prefix ui

      - name: Lint UI
        run: npm --prefix ui run lint

      - name: Test UI
        run: npm --prefix ui test

      - name: Build UI dist (required by izwi-desktop compile-time Tauri config)
        run: npm --prefix ui run build

      - name: Build CLI, gateway, supervisor, and worker binaries (Linux/Windows)
        if: runner.os != 'macOS'
        run: |
          # izwi-desktop bundles izwi/izwi-server as resources, so build those first.
          # Native Linux/Windows serving workers remain CPU-only. izwi-server and
          # the standalone izwi-gateway (no inference engine) ship with
          # PostgreSQL support (IZWI_DATABASE_URL=postgres://...).
          cargo build --release --bin izwi --bin izwi-server --bin izwi-gateway --bin izwi-serving-supervisor --bin izwi-serving-worker --features izwi-server/db-postgres,izwi-gateway/db-postgres

      - name: Build CLI, gateway, supervisor, and worker binaries (macOS 15+ Metal, macOS 12 deployment)
        if: runner.os == 'macOS'
        env:
          MACOSX_DEPLOYMENT_TARGET: "12.0"
        run: |
          cargo build --release -p izwi-cli --features metal
          cargo build --release -p izwi-server --features metal,db-postgres
          cargo build --release -p izwi-gateway --features db-postgres
          cargo build --release -p izwi-serving-supervisor
          cargo build --release -p izwi-serving-worker --features metal

      - name: Build desktop binary
        env:
          MACOSX_DEPLOYMENT_TARGET: "13.3"
        run: |
          cargo build --release --bin izwi-desktop

      - name: Verify macOS binary deployment floor
        if: runner.os == 'macOS'
        run: |
          # The terminal binaries run on macOS 12. The desktop app needs
          # macOS 13.3: its UI requires WebKit (Safari) 16.4.
          verify_floor() {
            minos="$(otool -l "$1" | awk '/LC_BUILD_VERSION/ { found=1; next } found && /minos/ { print $2; exit }')"
            if [[ "$minos" != "$2" ]]; then
              echo "::error::$1 has deployment floor '$minos', expected $2."
              exit 1
            fi
          }
          for binary in target/release/izwi target/release/izwi-server target/release/izwi-gateway target/release/izwi-serving-supervisor target/release/izwi-serving-worker; do
            verify_floor "$binary" 12.0
          done
          verify_floor target/release/izwi-desktop 13.3

      - name: Package terminal binaries (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir -p release-assets
          tar -czf "release-assets/izwi-cli-${GITHUB_REF_NAME}-${{ matrix.asset_suffix }}.tar.gz" \
            -C "${{ github.workspace }}/target/release" \
            izwi izwi-server izwi-gateway izwi-serving-supervisor izwi-serving-worker izwi-desktop \
            -C "${{ github.workspace }}/config/serving" \
            izwi-serving-node.example.toml

      - name: Package terminal binaries (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Compress-Archive -Path `
            target/release/izwi.exe, `
            target/release/izwi-server.exe, `
            target/release/izwi-gateway.exe, `
            target/release/izwi-serving-supervisor.exe, `
            target/release/izwi-serving-worker.exe, `
            config/serving/izwi-serving-node.example.toml, `
            target/release/izwi-desktop.exe `
            -DestinationPath "release-assets/izwi-cli-$($env:GITHUB_REF_NAME)-${{ matrix.asset_suffix }}.zip" `
            -Force

      - name: Include macOS uninstall helper
        if: runner.os == 'macOS'
        run: |
          mkdir -p release-assets
          cp scripts/uninstall-macos.sh "release-assets/uninstall-izwi-macos.sh"

      - name: Install Tauri CLI
        # At least the tauri crate's minor. rust-cache restores ~/.cargo/bin,
        # and an older cached CLI that still satisfies the range is kept.
        run: cargo install tauri-cli --locked --version "^2.12"

      - name: Build desktop bundle (Linux)
        if: runner.os == 'Linux'
        env:
          CI: "true"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          cargo tauri build \
            --bundles deb,appimage

      - name: Build desktop bundle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CI: "true"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          cargo tauri build --bundles ${{ matrix.bundle_kind }}

      # Without the Apple secrets, any release (stable included) ships a macOS
      # build that is not notarized: first launch needs Open Anyway in
      # Privacy & Security (docs/user/installation/macos.md).
      - name: Build desktop bundle (unsigned macOS)
        if: runner.os == 'macOS' && env.APPLE_SIGNING_IDENTITY == ''
        env:
          CI: "true"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          MACOSX_DEPLOYMENT_TARGET: "13.3"
        run: |
          echo "::warning::No Apple signing secrets: this macOS build is not signed with a Developer ID or notarized."
          env -u APPLE_SIGNING_IDENTITY \
            -u APPLE_CERTIFICATE \
            -u APPLE_CERTIFICATE_PASSWORD \
            -u APPLE_ID \
            -u APPLE_PASSWORD \
            -u APPLE_TEAM_ID \
            cargo tauri build \
            --bundles app,${{ matrix.bundle_kind }} \
            --config crates/izwi-desktop/tauri.macos.conf.json

      - name: Build desktop bundle (signed macOS)
        if: runner.os == 'macOS' && env.APPLE_SIGNING_IDENTITY != ''
        env:
          CI: "true"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          MACOSX_DEPLOYMENT_TARGET: "13.3"
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cargo tauri build \
            --bundles app,${{ matrix.bundle_kind }} \
            --config crates/izwi-desktop/tauri.macos.conf.json

      - name: Verify macOS bundle deployment floor
        if: runner.os == 'macOS'
        run: |
          app_path="$(find target crates/izwi-desktop/target -type d -path '*/release/bundle/macos/*.app' | head -n 1)"
          if [[ -z "$app_path" ]]; then
            echo "::error::Could not find the built macOS app bundle."
            exit 1
          fi
          minos="$(plutil -extract LSMinimumSystemVersion raw -o - "$app_path/Contents/Info.plist")"
          if [[ "$minos" != "13.3" ]]; then
            echo "::error::$app_path has LSMinimumSystemVersion '$minos', expected 13.3."
            exit 1
          fi

      - name: Collect updater artifacts (Linux)
        if: runner.os == 'Linux'
        run: |
          appimage_path="$(
            (
              find target -type f -path "*/release/bundle/appimage/*.AppImage" 2>/dev/null
              find crates/izwi-desktop/target -type f -path "*/release/bundle/appimage/*.AppImage" 2>/dev/null
            ) | head -n 1
          )"
          if [ -z "$appimage_path" ]; then
            echo "Could not find AppImage updater bundle."
            exit 1
          fi
          sig_path="${appimage_path}.sig"
          if [ ! -f "$sig_path" ]; then
            echo "Could not find AppImage updater signature at $sig_path."
            exit 1
          fi
          cp "$appimage_path" release-assets/
          cp "$sig_path" release-assets/

      - name: Collect updater artifacts (macOS)
        if: runner.os == 'macOS'
        run: |
          updater_bundle="$(
            (
              find target -type f -path "*/release/bundle/macos/*.app.tar.gz" 2>/dev/null
              find crates/izwi-desktop/target -type f -path "*/release/bundle/macos/*.app.tar.gz" 2>/dev/null
            ) | head -n 1
          )"
          if [ -z "$updater_bundle" ]; then
            echo "Could not find macOS updater bundle (.app.tar.gz)."
            exit 1
          fi
          sig_path="${updater_bundle}.sig"
          if [ ! -f "$sig_path" ]; then
            echo "Could not find macOS updater signature at $sig_path."
            exit 1
          fi
          cp "$updater_bundle" release-assets/
          cp "$sig_path" release-assets/

      - name: Collect updater artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $preferredDirPattern = '[\\/]release[\\/]bundle[\\/]nsis[\\/]'
          $fallbackDirPattern = '[\\/]release[\\/]bundle[\\/]nsis-updater[\\/]'

          $candidates = Get-ChildItem -Path "target","crates/izwi-desktop/target" -Recurse -File |
            Where-Object {
              $_.Name -match '-setup\.exe$' -and
              (
                $_.FullName -match $preferredDirPattern -or
                $_.FullName -match $fallbackDirPattern
              )
            }

          $updaterBundle = $candidates |
            Sort-Object `
              @{ Expression = { $_.FullName -match $preferredDirPattern }; Descending = $true }, `
              @{ Expression = "LastWriteTime"; Descending = $true } |
            Select-Object -First 1

          if (-not $updaterBundle) {
            Write-Host "Discovered setup executables:"
            Get-ChildItem -Path "target","crates/izwi-desktop/target" -Recurse -File |
              Where-Object { $_.Name -match '-setup\.exe$' } |
              Select-Object -ExpandProperty FullName
            throw "Could not find Windows updater bundle (setup.exe) in nsis/nsis-updater."
          }

          $signaturePath = "$($updaterBundle.FullName).sig"
          if (-not (Test-Path $signaturePath)) {
            throw "Could not find Windows updater signature at $signaturePath."
          }

          Copy-Item $signaturePath -Destination release-assets

      - name: Collect desktop bundle artifact (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          bundle_path="$(
            (
              find target -type f \
                -path "*/release/bundle/${{ matrix.bundle_kind }}/*.${{ matrix.bundle_ext }}" 2>/dev/null
              find crates/izwi-desktop/target -type f \
                -path "*/release/bundle/${{ matrix.bundle_kind }}/*.${{ matrix.bundle_ext }}" 2>/dev/null
            ) | head -n 1
          )"
          if [ -z "$bundle_path" ]; then
            echo "Could not find desktop bundle for ${{ matrix.bundle_kind }}."
            exit 1
          fi
          cp "$bundle_path" release-assets/
          # A signed .deb lets a .deb install update itself (linux-deb).
          if [ -f "${bundle_path}.sig" ]; then
            cp "${bundle_path}.sig" release-assets/
          fi

      - name: Collect desktop bundle artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $preferredDirPattern = '[\\/]release[\\/]bundle[\\/]nsis[\\/]'
          $fallbackDirPattern = '[\\/]release[\\/]bundle[\\/]nsis-updater[\\/]'

          $bundleCandidates = Get-ChildItem -Path "target","crates/izwi-desktop/target" -Recurse -File |
            Where-Object {
              $_.Name -match '-setup\.exe$' -and
              (
                $_.FullName -match $preferredDirPattern -or
                $_.FullName -match $fallbackDirPattern
              )
            }

          $bundle = $bundleCandidates |
            Sort-Object `
              @{ Expression = { $_.FullName -match $preferredDirPattern }; Descending = $true }, `
              @{ Expression = "LastWriteTime"; Descending = $true } |
            Select-Object -First 1

          if (-not $bundle) {
            throw "Could not find desktop bundle for ${{ matrix.bundle_kind }} (setup.exe in nsis/nsis-updater)."
          }

          Copy-Item $bundle.FullName -Destination release-assets

      - name: Verify native release artifacts (Linux/macOS)
        if: runner.os != 'Windows'
        run: scripts/release/verify-native-artifacts.sh --artifact-dir release-assets

      - name: Verify native release artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/release/verify-native-artifacts.ps1 -ArtifactDir release-assets

      - name: Upload release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.asset_suffix }}
          path: release-assets/*
          if-no-files-found: error

  # Container images. Each image and platform builds on its own runner (arm64
  # natively, no emulation) and is pushed by digest; docker-publish then joins
  # the platforms under the release tags, signs the result with Sigstore
  # (keyless, through this workflow's OIDC identity) and attests its
  # provenance. BuildKit adds SLSA provenance and an SBOM to every platform.
  docker-build:
    name: Build ${{ matrix.variant }} image (${{ matrix.arch }})
    needs: versions
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - { variant: cpu, repo: izwi, target: production, arch: amd64, runner: ubuntu-24.04 }
          - { variant: cpu, repo: izwi, target: production, arch: arm64, runner: ubuntu-24.04-arm }
          - { variant: cuda, repo: izwi, target: production-cuda, arch: amd64, runner: ubuntu-24.04 }
          - { variant: gateway, repo: izwi-gateway, target: production-gateway, arch: amd64, runner: ubuntu-24.04 }
          - { variant: gateway, repo: izwi-gateway, target: production-gateway, arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The CUDA devel image and its build need more than the runner's free
      # disk; drop preinstalled SDKs this job never uses.
      - name: Free disk space
        if: matrix.variant == 'cuda'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.repo }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: IZWI_BUILD_GIT_SHA=${{ github.sha }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/${{ matrix.repo }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.variant }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}-${{ matrix.arch }}

      - name: Export the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - name: Upload the digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.variant }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-publish:
    name: Publish ${{ matrix.variant }} image
    needs: docker-build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { variant: cpu, repo: izwi, suffix: "" }
          - { variant: cuda, repo: izwi, suffix: "-cuda" }
          - { variant: gateway, repo: izwi-gateway, suffix: "" }
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.repo }}
    steps:
      - name: Download the digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-${{ matrix.variant }}-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 0.1.1 and 0.1 (plus latest) for stable tags; prereleases get only
      # their own version.
      - name: Release tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=auto
            suffix=${{ matrix.suffix }},onlatest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Join the platform images under the release tags
        id: manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          tags=()
          while IFS= read -r tag; do
            tags+=(--tag "${tag}")
          done < <(jq -r '.tags[]' <<< "${DOCKER_METADATA_OUTPUT_JSON}")
          sources=()
          for digest in *; do
            sources+=("${IMAGE}@sha256:${digest}")
          done
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          first_tag="$(jq -r '.tags[0]' <<< "${DOCKER_METADATA_OUTPUT_JSON}")"
          digest="$(docker buildx imagetools inspect "${first_tag}" --format '{{json .Manifest}}' | jq -r .digest)"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Sign the image (keyless)
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download built artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Show release files
        run: ls -lah dist

      - name: Verify downloaded native release artifacts
        run: scripts/release/verify-native-artifacts.sh --artifact-dir dist

      - name: Generate release support note
        run: |
          cat > release-support.md <<'EOF'
          ## Runtime Support

          - macOS native artifacts use Metal on Apple Silicon with macOS 15 or later and fall back to CPU on older macOS. The desktop app needs macOS 13.3 or later; terminal archives run on macOS 12 or later.
          - Linux and Windows native artifacts are CPU-only and intentionally do not bundle CUDA runtime libraries.
          - Terminal archives include `izwi-server`, the standalone `izwi-gateway` (the preferred gateway: it links no inference engine; `izwi-server --role gateway` still works), the CPU-only `izwi-serving-supervisor`, one backend-appropriate `izwi-serving-worker`, and a bounded single-node configuration example.
          - The packaged supervisor accepts explicit CPU inventory only. Metal/CUDA supervisor inventory and launch profiles remain fail-closed and are release blockers for those supervised lanes.
          - NVIDIA CUDA is supported through the Docker `production-cuda` target / `docker compose --profile cuda` and through source builds with `--features cuda`.
          - Native artifacts are checked for CUDA runtime payloads and per-file size before release publication.

          ## Container images

          Signed with Sigstore (keyless, through this repository's release workflow), with SLSA provenance and an SBOM:

          - `ghcr.io/@OWNER@/izwi:@VERSION@`: CPU, linux/amd64 and linux/arm64
          - `ghcr.io/@OWNER@/izwi:@VERSION@-cuda`: CUDA 13.0 (NVIDIA driver 580 or newer), linux/amd64
          - `ghcr.io/@OWNER@/izwi-gateway:@VERSION@`: API gateway, linux/amd64 and linux/arm64

          Verify an image before running it (cosign 3 or newer):

          ```bash
          cosign verify ghcr.io/@OWNER@/izwi:@VERSION@ \
            --certificate-identity-regexp '^https://github.com/@REPO@/\.github/workflows/release\.yml@refs/tags/' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          gh attestation verify oci://ghcr.io/@OWNER@/izwi:@VERSION@ --repo @REPO@
          ```
          EOF
          sed -i \
            -e "s|@OWNER@|${GITHUB_REPOSITORY_OWNER}|g" \
            -e "s|@REPO@|${GITHUB_REPOSITORY}|g" \
            -e "s|@VERSION@|${GITHUB_REF_NAME#v}|g" \
            release-support.md

      - name: Generate updater manifest
        run: |
          # Stable tags publish latest.json; prereleases latest-beta.json.
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            manifest="dist/latest-beta.json"
          else
            manifest="dist/latest.json"
          fi
          echo "UPDATER_MANIFEST=${manifest}" >> "$GITHUB_ENV"

          linux_bundle="$(find dist -maxdepth 1 -type f -name '*.AppImage' | head -n 1)"
          macos_bundle="$(find dist -maxdepth 1 -type f -name '*.app.tar.gz' | head -n 1)"
          windows_bundle="$(find dist -maxdepth 1 -type f -name '*-setup.exe' | head -n 1)"
          deb_bundle="$(find dist -maxdepth 1 -type f -name '*.deb' | head -n 1)"

          if [ -z "$linux_bundle" ] || [ -z "$macos_bundle" ] || [ -z "$windows_bundle" ]; then
            echo "::error::Missing updater bundles in dist/."
            exit 1
          fi

          for bundle in "$linux_bundle" "$macos_bundle" "$windows_bundle"; do
            if [ ! -f "${bundle}.sig" ]; then
              echo "::error::Missing updater signature ${bundle}.sig."
              exit 1
            fi
          done

          base_url="https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}"
          entry() {
            jq -n --arg url "${base_url}/$(basename "$1")" --arg signature "$(tr -d '\r\n' < "$1.sig")" \
              '{url: $url, signature: $signature}'
          }
          platforms="$(jq -n \
            --argjson linux "$(entry "$linux_bundle")" \
            --argjson macos "$(entry "$macos_bundle")" \
            --argjson windows "$(entry "$windows_bundle")" \
            '{linux: $linux, macos: $macos, windows: $windows}')"
          # A .deb install updates with the .deb when the build signed it.
          if [ -n "$deb_bundle" ] && [ -f "${deb_bundle}.sig" ]; then
            platforms="$(jq --argjson deb "$(entry "$deb_bundle")" '. + {"linux-deb": $deb}' <<< "$platforms")"
          else
            echo "::warning::No signed .deb in dist/: .deb installs get no in-app update for this release."
          fi

          # Desktop builds from this release refuse to update a Mac older than
          # the bundle's floor, instead of installing an app it can't open.
          macos_floor="$(jq -r '.bundle.macOS.minimumSystemVersion // empty' crates/izwi-desktop/tauri.conf.json)"
          if [ -z "$macos_floor" ]; then
            echo "::error::crates/izwi-desktop/tauri.conf.json has no bundle.macOS.minimumSystemVersion."
            exit 1
          fi

          jq -n \
            --arg version "${GITHUB_REF_NAME}" \
            --arg notes "Izwi ${GITHUB_REF_NAME}" \
            --arg pub_date "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" \
            --argjson platforms "$platforms" \
            --arg macos_floor "$macos_floor" \
            '{version: $version, notes: $notes, pub_date: $pub_date, platforms: $platforms, minimum_system_version: {macos: $macos_floor}}' > "$manifest"
          cat "$manifest"

      - name: Validate updater manifest
        run: |
          jq -e '.version and .platforms.linux.url and .platforms.linux.signature and .platforms.macos.url and .platforms.macos.signature and .platforms.windows.url and .platforms.windows.signature and .minimum_system_version.macos' "$UPDATER_MANIFEST" > /dev/null

      - name: Enforce updater asset matrix consistency
        run: |
          version="$(jq -r '.version' "$UPDATER_MANIFEST")"
          if [ "$version" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::$(basename "$UPDATER_MANIFEST") version ($version) does not match tag (${GITHUB_REF_NAME})."
            exit 1
          fi

          jq -r '.platforms | to_entries[] | [.key, .value.url, .value.signature] | @tsv' "$UPDATER_MANIFEST" | \
          while IFS=$'\t' read -r platform_key asset_url signature; do
            if [ -z "$signature" ] || [ "$signature" = "null" ]; then
              echo "::error::Missing signature for platform $platform_key."
              exit 1
            fi
            if [ "${#signature}" -lt 64 ]; then
              echo "::error::Signature for platform $platform_key looks too short."
              exit 1
            fi

            asset_name="$(basename "$asset_url")"
            if [ ! -f "dist/$asset_name" ]; then
              echo "::error::Manifest points to missing asset dist/$asset_name for platform $platform_key."
              exit 1
            fi
          done

      - name: Create release and upload assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: Izwi ${{ github.ref_name }}
          body_path: release-support.md
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist/*
