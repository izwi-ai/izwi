name: CUDA FlashAttention

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

concurrency:
  group: cuda-flash-attn-${{ github.ref }}
  cancel-in-progress: true

env:
  CUDA_COMPUTE_CAP: "80"
  IZWI_CUDA_FEATURES: "cuda,cudnn"

jobs:
  cargo-cuda-flash-attn:
    name: CUDA FlashAttention Compile (Driverless)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: nvidia/cuda:12.4.1-cudnn-devel-ubuntu22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # The workspace .cargo/config.toml sets a python3 rustc-wrapper; the
      # NVIDIA base image ships no python interpreter, so install one or
      # every cargo invocation in this container dies at startup.
      - name: Install container build dependencies
        run: |
          apt-get update
          apt-get install -y \
            build-essential \
            ca-certificates \
            curl \
            git \
            pkg-config \
            libssl-dev \
            python3

      # Keep the required PR compile on the same toolchain as the shipped
      # Docker CUDA builder (Dockerfile rust-builder-cuda).
      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y \
            --profile minimal \
            --default-toolchain 1.88.0
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Compile CUDA FlashAttention harnesses without execution
        run: scripts/ci/check-backend-truth.sh cargo-cuda-compile

  docker-cuda-flash-attn:
    name: Docker Build (CUDA FlashAttention)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DOCKER_BUILDKIT: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run CUDA FlashAttention Docker build checks
        run: scripts/ci/check-backend-truth.sh docker-cuda
