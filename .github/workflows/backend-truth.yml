name: Backend Truth

on:
  pull_request:
    paths:
      - ".github/workflows/backend-truth.yml"
      - ".github/workflows/cuda-flash-attn.yml"
      - ".github/workflows/cuda-model-evidence.yml"
      - ".github/workflows/release.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Dockerfile"
      - "docker-compose.yml"
      - "config.docker.toml"
      - "crates/**"
      - "scripts/**"
      - "ui/**"
  push:
    branches:
      - main
      - master
    paths:
      - ".github/workflows/backend-truth.yml"
      - ".github/workflows/cuda-flash-attn.yml"
      - ".github/workflows/cuda-model-evidence.yml"
      - ".github/workflows/release.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Dockerfile"
      - "docker-compose.yml"
      - "config.docker.toml"
      - "crates/**"
      - "scripts/**"
      - "ui/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-truth-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Repository Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Linux dependencies for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            ripgrep

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run repository hygiene gates
        run: |
          set -o pipefail
          scripts/ci/check-backend-truth.sh hygiene 2>&1 | tee "${RUNNER_TEMP}/hygiene.log"

      # TEMPORARY debug aid: surface the lane output as an artifact while the
      # auth-gated job logs are unavailable; remove once hygiene is green.
      - name: Upload hygiene log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hygiene-log-${{ github.run_number }}
          path: ${{ runner.temp }}/hygiene.log
          if-no-files-found: ignore
          retention-days: 3

  cargo-cpu:
    name: Cargo Validation (CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libssl-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Run CPU backend validation
        run: scripts/ci/check-backend-truth.sh cargo-cpu

  fleet-stores:
    name: Fleet Store Validation (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: izwi
          POSTGRES_PASSWORD: izwi
          POSTGRES_DB: izwi_fleet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U izwi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      IZWI_TEST_FLEET_PG_URL: postgres://izwi:izwi@localhost:5432/izwi_fleet_test
      IZWI_TEST_FLEET_RIG_PG_URL: postgres://izwi:izwi@localhost:5432/izwi_fleet_rig

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libssl-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Create the fleet rig database
        run: |
          PGPASSWORD=izwi psql -h localhost -U izwi -d postgres -c "CREATE DATABASE izwi_fleet_rig"

      - name: Run fleet store validation
        run: scripts/ci/check-backend-truth.sh cargo-fleet-stores

      - name: Run the fleet rig PostgreSQL lane
        run: scripts/ci/check-backend-truth.sh cargo-fleet-rig-postgres

  cargo-cuda:
    name: CUDA Compile (Driverless)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CUDA_COMPUTE_CAP: "80"
      # Keep the required PR build on Candle's base CUDA path; the normal
      # product `cuda` feature includes paged FlashAttention and is exercised
      # by the longer CUDA workflow.
      IZWI_CUDA_FEATURES: "cuda-base,cudnn-base"
    container:
      image: nvidia/cuda:12.4.1-cudnn-devel-ubuntu22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # The workspace .cargo/config.toml sets a python3 rustc-wrapper; the
      # NVIDIA base image ships no python interpreter, so install one or
      # every cargo invocation in this container dies at startup.
      - name: Install container build dependencies
        run: |
          apt-get update
          apt-get install -y \
            build-essential \
            ca-certificates \
            curl \
            git \
            pkg-config \
            libssl-dev \
            python3

      # Keep the required PR compile on the same toolchain as the shipped
      # Docker CUDA builder (Dockerfile rust-builder-cuda).
      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y \
            --profile minimal \
            --default-toolchain 1.88.0
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Compile CUDA harnesses without execution
        run: scripts/ci/check-backend-truth.sh cargo-cuda-compile

  cuda-device-certification:
    name: CUDA Device Numerical Certification
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, linux, x64, nvidia]
    environment: cuda-certification
    concurrency:
      group: cuda-device-certification
      cancel-in-progress: false
    timeout-minutes: 180
    env:
      CUDA_COMPUTE_CAP: "80"
      IZWI_KV_CERT_ITERATIONS: "30"
      IZWI_KV_CERT_WARMUP: "5"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run required native and FlashAttention device certification
        run: scripts/ci/check-backend-truth.sh cargo-cuda-device

      - name: Retain numerical certification records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kv-cache-cuda-certification-${{ github.sha }}
          path: target/kv-cache-cuda-certification.jsonl
          if-no-files-found: error
          retention-days: 90

  cargo-metal:
    name: Cargo Validation (${{ matrix.contract }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            contract: macOS 12-14 CPU fallback
            command: cargo-metal-fallback
          - os: macos-15
            contract: macOS 15+ Metal
            command: cargo-metal
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Run Metal backend validation
        run: scripts/ci/check-backend-truth.sh ${{ matrix.command }}

  docker-cpu:
    name: Docker Build (CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run CPU Docker build checks
        env:
          DOCKER_BUILDKIT: "1"
        run: scripts/ci/check-backend-truth.sh docker-cpu

  docker-cuda:
    name: Docker Build (CUDA)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DOCKER_BUILDKIT: "1"
      CUDA_COMPUTE_CAP: "80"
      IZWI_CUDA_FEATURES: "cuda-base,cudnn-base"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run CUDA Docker build checks
        run: scripts/ci/check-backend-truth.sh docker-cuda
