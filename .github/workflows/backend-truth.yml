name: Backend Truth

on:
  pull_request:
    paths:
      - ".github/workflows/backend-truth.yml"
      - ".github/workflows/cuda-flash-attn.yml"
      - ".github/workflows/release.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Dockerfile"
      - "docker-compose.yml"
      - "config.docker.toml"
      - "crates/**"
      - "scripts/**"
      - "ui/**"
  push:
    branches:
      - main
      - master
    paths:
      - ".github/workflows/backend-truth.yml"
      - ".github/workflows/cuda-flash-attn.yml"
      - ".github/workflows/release.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Dockerfile"
      - "docker-compose.yml"
      - "config.docker.toml"
      - "crates/**"
      - "scripts/**"
      - "ui/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-truth-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Repository Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run repository hygiene gates
        run: scripts/ci/check-backend-truth.sh hygiene

  cargo-cpu:
    name: Cargo Validation (CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libssl-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Run CPU backend validation
        run: scripts/ci/check-backend-truth.sh cargo-cpu

  cargo-cuda:
    name: Cargo Validation (CUDA)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CUDA_COMPUTE_CAP: "80"
      # Keep the required PR build on Candle's base CUDA path; the normal
      # product `cuda` feature includes paged FlashAttention and is exercised
      # by the longer CUDA workflow.
      IZWI_CUDA_FEATURES: "cuda-base,cudnn-base"
    container:
      image: nvidia/cuda:12.4.1-cudnn-devel-ubuntu22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install container build dependencies
        run: |
          apt-get update
          apt-get install -y \
            build-essential \
            ca-certificates \
            curl \
            git \
            pkg-config \
            libssl-dev

      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y \
            --profile minimal \
            --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Run CUDA backend validation
        run: scripts/ci/check-backend-truth.sh cargo-cuda

  cuda-device-certification:
    name: CUDA Device Numerical Certification
    runs-on: [self-hosted, linux, x64, nvidia]
    timeout-minutes: 180
    env:
      CUDA_COMPUTE_CAP: "80"
      IZWI_KV_CERT_ITERATIONS: "30"
      IZWI_KV_CERT_WARMUP: "5"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run required native and FlashAttention device certification
        run: scripts/ci/check-backend-truth.sh cargo-cuda-device

      - name: Retain numerical certification records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kv-cache-cuda-certification-${{ github.sha }}
          path: target/kv-cache-cuda-certification.jsonl
          if-no-files-found: error
          retention-days: 90

  cargo-metal:
    name: Cargo Validation (Metal)
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Run Metal backend validation
        run: scripts/ci/check-backend-truth.sh cargo-metal

  docker-cpu:
    name: Docker Build (CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run CPU Docker build checks
        env:
          DOCKER_BUILDKIT: "1"
        run: scripts/ci/check-backend-truth.sh docker-cpu

  docker-cuda:
    name: Docker Build (CUDA)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DOCKER_BUILDKIT: "1"
      CUDA_COMPUTE_CAP: "80"
      IZWI_CUDA_FEATURES: "cuda-base,cudnn-base"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run CUDA Docker build checks
        run: scripts/ci/check-backend-truth.sh docker-cuda
