name: Managed KV Lifecycle Soak

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Soak profile
        required: true
        default: nightly
        type: choice
        options:
          - smoke
          - pr
          - nightly
  schedule:
    - cron: "41 1 * * *"

permissions:
  contents: read

concurrency:
  group: kv-lifecycle-soak-${{ github.ref }}
  cancel-in-progress: false

jobs:
  managed-kv-lifecycle:
    name: Managed KV Lifecycle (${{ inputs.profile || 'nightly' }})
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust toolchain
        # Pinned: a new stable release can add clippy lints that fail
        # `-D warnings` with no repo change. Bump deliberately, together
        # with the version the lanes are verified with locally. No
        # rust-toolchain.toml: it would override the 1.88.0 (MSRV) CUDA
        # compile lanes, which install that version as the rustup default.
        uses: dtolnay/rust-toolchain@1.99.0

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run managed KV lifecycle soak
        run: scripts/ci/run-kv-lifecycle-soak.sh --profile "${{ inputs.profile || 'nightly' }}"
