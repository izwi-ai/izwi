[workspace]
resolver = "3"
members = [
    "crates/izwi-asr-toolkit",
    "crates/izwi-agent",
    "crates/izwi-core",
    "crates/izwi-db",
    "crates/izwi-env",
    "crates/izwi-model-catalog",
    "crates/izwi-prometheus",
    "crates/izwi-hooks",
    "crates/izwi-vad",
    "crates/izwi-server",
    "crates/izwi-gateway",
    "crates/izwi-cli",
    "crates/izwi-desktop",
    "crates/izwi-serving-protocol",
    "crates/izwi-serving-client",
    "crates/izwi-serving-fence",
    "crates/izwi-serving-supervisor",
    "crates/izwi-serving-worker",
    "crates/izwi-test-process",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/izwi-ai/izwi"
authors = ["Izwi <hi@izwiai.com>"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1.43", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"
async-stream = "0.3"
async-trait = "0.1"

# Web framework
axum = { version = "0.8.9", features = ["ws", "multipart"] }
tower = "0.5.3"
tower-http = { version = "0.6.8", features = ["cors", "fs", "trace"] }
utoipa = { version = "5.4.0", features = ["preserve_path_order"] }
scalar_api_reference = { version = "0.2.2", features = ["axum"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Model loading
safetensors = "0.4"
tokenizers = "0.22.2"

# Candle (native inference)
candle-core = "0.11.0"
candle-nn = "0.11.0"
candle-transformers = "0.11.0"
half = "2.7"

# Audio processing
hound = "3.5"
symphonia = { version = "0.5", default-features = false }
rubato = "0.15"
rustfft = "6.2"

# MLX bindings (Apple Silicon ML framework)
# Note: mlx-rs is still experimental, we'll use FFI bindings
# mlx-rs = { git = "https://github.com/oxideai/mlx-rs" }

# Utilities
anyhow = "1.0"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
bytes = "1.9"
base64 = "0.22"
# rustls without reqwest's built-in aws-lc-rs provider (see `rustls` below):
# every process installs ring before it builds a client, or hands reqwest a
# ready rustls config. HTTP/2 and charset decoding stopped being implied in
# reqwest 0.12, so they are listed.
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "stream",
    "blocking",
    "http2",
    "charset",
    "rustls-no-provider",
] }
# ring is the only rustls crypto provider in the tree: aws-lc-rs next to it
# makes rustls' default-provider lookups panic. Keep default features off.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
indicatif = "0.18"
dirs = "5.0"
sha2 = "0.10"
hmac = "0.12"
rand = "0.10"
subtle = "2.6"
memmap2 = "0.9.10"

# With fp16 disabled for Candle on Apple Silicon, gemm-f16's inline fp16
# assembly needs enough optimization to remain in its target-feature context.
# The built-in test profile inherits this dev override; release is already
# optimized. Scope it to Candle 0.11.0's exact transitive gemm-f16 version.
[profile.dev.package."gemm-f16:0.19.0"]
opt-level = 1
