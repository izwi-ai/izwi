# =============================================================================
# Izwi Audio - Production Docker Compose
# =============================================================================
#
# Usage (set IZWI_API_KEY first, e.g. in .env; clients send it as
# "Authorization: Bearer <key>"):
#   CPU:  IZWI_API_KEY=... docker compose up -d
#   CUDA: IZWI_API_KEY=... docker compose --profile cuda up -d
#
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Main application (CPU)
  # ---------------------------------------------------------------------------
  izwi:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: izwi:latest
    pull_policy: never
    container_name: izwi
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - izwi-models:/app/models
      - izwi-data:/app/data
    environment:
      # Required: the container binds 0.0.0.0, so the server needs an API key.
      - IZWI_API_KEY=${IZWI_API_KEY:-}
      - IZWI_CONFIG_PATH=/app/config.toml
      - IZWI_UI_DIR=/app/ui/dist
      - IZWI_MODELS_DIR=/app/models
      - HF_HOME=/app/models/huggingface
      - TRANSFORMERS_CACHE=/app/models/huggingface
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/readyz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # Main application (CUDA) - activated with --profile cuda
  # ---------------------------------------------------------------------------
  izwi-cuda:
    build:
      context: .
      dockerfile: Dockerfile
      target: production-cuda
      args:
        CUDA_COMPUTE_CAP: ${CUDA_COMPUTE_CAP:-80}
        IZWI_CUDA_FEATURES: ${IZWI_CUDA_FEATURES:-cuda,cudnn}
    image: izwi:cuda
    pull_policy: never
    container_name: izwi-cuda
    profiles:
      - cuda
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - izwi-models:/app/models
      - izwi-data:/app/data
    environment:
      # Required: the container binds 0.0.0.0, so the server needs an API key.
      - IZWI_API_KEY=${IZWI_API_KEY:-}
      - IZWI_CONFIG_PATH=/app/config.toml
      - IZWI_UI_DIR=/app/ui/dist
      - IZWI_MODELS_DIR=/app/models
      - IZWI_BACKEND=cuda
      - IZWI_LFM2_DIAGNOSTICS=${IZWI_LFM2_DIAGNOSTICS:-0}
      # Candidate native Fish batching stays opt-in until this GPU is qualified.
      - IZWI_FISH_NATIVE_BATCHING=${IZWI_FISH_NATIVE_BATCHING:-false}
      - IZWI_TTS_TOTAL_SPOOL_BYTES=${IZWI_TTS_TOTAL_SPOOL_BYTES:-1073741824}
      - IZWI_TTS_TOTAL_UPLOAD_BYTES=${IZWI_TTS_TOTAL_UPLOAD_BYTES:-268435456}
      - IZWI_AUDIO_STREAM_TOTAL_EVENT_BYTES=${IZWI_AUDIO_STREAM_TOTAL_EVENT_BYTES:-67108864}
      - HF_HOME=/app/models/huggingface
      - TRANSFORMERS_CACHE=/app/models/huggingface
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/readyz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  izwi-models:
    name: izwi-models
  izwi-data:
    name: izwi-data

networks:
  default:
    name: izwi-network
