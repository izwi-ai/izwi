# =============================================================================
# Izwi Audio - Docker Compose (development by default, production by overlay)
# =============================================================================
#
# Development (the default):
#   CPU:  docker compose up -d
#   CUDA: docker compose --profile cuda up -d izwi-cuda
#         (name the service: both publish the same port and share the volumes)
#   Then open http://localhost:8080.
#
#   The port is published on the host's 127.0.0.1 only, and the server runs as
#   a loopback-only server (IZWI_LOOPBACK_PUBLISHED): no API key, and only
#   loopback Host names are answered, as when Izwi runs natively. Other
#   machines cannot reach it. Containers on this network that call it by
#   service name need IZWI_ALLOWED_HOSTS=izwi.
#
# Production: add docker-compose.prod.yml, which requires an API key, can
# publish beyond loopback, restarts the server and logs JSON. Either put
#   COMPOSE_FILE=docker-compose.yml:docker-compose.prod.yml
#   COMPOSE_PATH_SEPARATOR=:
#   IZWI_API_KEY=...   (openssl rand -hex 32)
# in .env (see .env.example) and keep running the commands above, or pass
# both files: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Models live in the izwi-models volume; history (the database) and media in
# izwi-data, so both survive `docker compose up --force-recreate`.
#
# =============================================================================

x-izwi-environment: &izwi-environment
  # The container binds 0.0.0.0, but the port below is published on loopback
  # only, so the server may treat itself as loopback-only.
  IZWI_LOOPBACK_PUBLISHED: "true"
  # Optional in development; enforced on /v1 and /internal when set.
  IZWI_API_KEY: ${IZWI_API_KEY:-}
  IZWI_ALLOWED_HOSTS: ${IZWI_ALLOWED_HOSTS:-}
  RUST_LOG: ${RUST_LOG:-izwi_server=info,izwi_gateway=info,izwi_db=info,izwi_core=info,tower_http=warn}

x-izwi-service: &izwi-service
  ports:
    - "127.0.0.1:${IZWI_PORT:-8080}:8080"
  volumes:
    - izwi-models:/app/models
    - izwi-data:/app/data
  # The server drains HTTP requests (20 s) and then batch jobs (20 s).
  stop_grace_period: 45s
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

services:
  # ---------------------------------------------------------------------------
  # Main application (CPU)
  # ---------------------------------------------------------------------------
  izwi:
    <<: *izwi-service
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: izwi:latest
    pull_policy: never
    container_name: izwi
    environment:
      <<: *izwi-environment

  # ---------------------------------------------------------------------------
  # Main application (CUDA) - activated with --profile cuda
  # ---------------------------------------------------------------------------
  izwi-cuda:
    <<: *izwi-service
    build:
      context: .
      dockerfile: Dockerfile
      target: production-cuda
      args:
        CUDA_COMPUTE_CAP: ${CUDA_COMPUTE_CAP:-80}
        IZWI_CUDA_FEATURES: ${IZWI_CUDA_FEATURES:-cuda,cudnn}
    image: izwi:cuda
    pull_policy: never
    container_name: izwi-cuda
    profiles:
      - cuda
    environment:
      <<: *izwi-environment
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  izwi-models:
    name: izwi-models
  izwi-data:
    name: izwi-data

networks:
  default:
    name: izwi-network
