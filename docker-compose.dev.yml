# =============================================================================
# Izwi Audio - Development Docker Compose
# =============================================================================
#
# Usage:
#   docker compose -f docker-compose.dev.yml up -d
#
# Then in separate terminals or using docker exec:
#   - Backend: docker compose -f docker-compose.dev.yml exec dev cargo watch -x "run -p izwi-server"
#   - Frontend: docker compose -f docker-compose.dev.yml exec dev bash -c "cd ui && npm run dev"
#
# Or use the convenience script:
#   ./scripts/dev.sh
#
# The repository is mounted at /app, so the database and media live outside it
# in the izwi-dev-data volume (/var/lib/izwi) and survive recreating the
# containers.
#
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Development container with all tools
  # ---------------------------------------------------------------------------
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: izwi:dev
    container_name: izwi-dev
    stdin_open: true
    tty: true
    ports:
      - "8080:8080"   # Rust backend
      - "5173:5173"   # Vite dev server
    volumes:
      # Mount source code for hot reload
      - .:/app:cached
      # Persist dependencies
      - cargo-cache:/root/.cargo/registry
      - cargo-git:/root/.cargo/git
      - target-cache:/app/target
      - node-modules:/app/ui/node_modules
      # Persist models, history and media
      - izwi-models:/app/models
      - izwi-dev-data:/var/lib/izwi
    environment:
      - CARGO_HOME=/root/.cargo
      - CARGO_TARGET_DIR=/app/target
      - HF_HOME=/app/models/huggingface
      - IZWI_MODELS_DIR=/app/models
      - IZWI_DB_PATH=/var/lib/izwi/izwi.sqlite3
      - IZWI_MEDIA_DIR=/var/lib/izwi/media
      # The published port needs a 0.0.0.0 bind, which requires an API key.
      - IZWI_HOST=0.0.0.0
      - IZWI_API_KEY=${IZWI_API_KEY:-}
      - TRANSFORMERS_CACHE=/app/models/huggingface
      # Vite needs to know the host for HMR
      - VITE_HOST=0.0.0.0
    working_dir: /app
    command: >
      bash -c "
        echo '=== Izwi Development Container ===' &&
        echo 'Installing Node dependencies...' &&
        cd /app/ui && npm install && cd /app &&
        echo '' &&
        echo 'Development environment ready!' &&
        echo '' &&
        echo 'Available commands:' &&
        echo '  Backend:  cargo watch -x \"run -p izwi-server\"' &&
        echo '  Frontend: cd ui && npm run dev -- --host' &&
        echo '  Tests:    cargo test' &&
        echo '' &&
        echo 'Starting shell...' &&
        exec bash
      "

  # ---------------------------------------------------------------------------
  # Rust backend service (alternative to running in dev container)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: izwi:dev
    container_name: izwi-backend
    profiles:
      - services
    ports:
      - "8080:8080"
    volumes:
      - .:/app:cached
      - cargo-cache:/root/.cargo/registry
      - cargo-git:/root/.cargo/git
      - target-cache:/app/target
      - izwi-models:/app/models
      - izwi-dev-data:/var/lib/izwi
    environment:
      - CARGO_HOME=/root/.cargo
      - CARGO_TARGET_DIR=/app/target
      - HF_HOME=/app/models/huggingface
      - IZWI_MODELS_DIR=/app/models
      - IZWI_DB_PATH=/var/lib/izwi/izwi.sqlite3
      - IZWI_MEDIA_DIR=/var/lib/izwi/media
      # The published port needs a 0.0.0.0 bind, which requires an API key.
      - IZWI_HOST=0.0.0.0
      - IZWI_API_KEY=${IZWI_API_KEY:-}
    working_dir: /app
    command: cargo watch -x "run -p izwi-server"

  # ---------------------------------------------------------------------------
  # Frontend dev server (alternative to running in dev container)
  # ---------------------------------------------------------------------------
  frontend:
    image: node:24-slim
    container_name: izwi-frontend
    profiles:
      - services
    ports:
      - "5173:5173"
    volumes:
      - ./ui:/app:cached
      - node-modules:/app/node_modules
    working_dir: /app
    environment:
      - VITE_HOST=0.0.0.0
    command: >
      bash -c "npm install && npm run dev -- --host"

volumes:
  cargo-cache:
    name: izwi-cargo-cache
  cargo-git:
    name: izwi-cargo-git
  target-cache:
    name: izwi-target-cache
  node-modules:
    name: izwi-node-modules
  izwi-models:
    name: izwi-models
  izwi-dev-data:
    name: izwi-dev-data

networks:
  default:
    name: izwi-dev-network
