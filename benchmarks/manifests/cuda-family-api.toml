# One API-exercisable representative per CUDA model implementation family.
# Models must be preprovisioned on the protected NVIDIA certification runner.
# Forced alignment, diarization, and the standalone speech tokenizer do not yet
# have benchmark subcommands; their absence is reported by the workflow rather
# than silently treated as model evidence.

[[benchmarks]]
name = "qwen3-chat-cuda"
command = "chat"
model = "Qwen3-0.6B-GGUF"
iterations = 1
prompt = "Reply with one short sentence about CUDA batching."
max_tokens = 16

[[benchmarks]]
name = "qwen35-chat-cuda"
command = "chat"
model = "Qwen3.5-0.8B"
iterations = 1
prompt = "Reply with one short sentence about paged attention."
max_tokens = 16

