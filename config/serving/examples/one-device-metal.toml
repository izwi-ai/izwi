# Parser-compatible only. Replace every REPLACE_* value and validate all
# illustrative budgets and the exact Metal identity against the target Mac.
schema_version = 2
node_id = "example-metal-node"
working_directory = "/REPLACE/WITH/IZWI_WORKING_DIRECTORY"
runtime_directory = "/REPLACE/WITH/IZWI_RUNTIME_DIRECTORY"
host_memory_budget_bytes = 8589934592

[readiness]
startup_timeout_ms = 120000
poll_interval_ms = 200

[restart]
initial_backoff_ms = 250
maximum_backoff_ms = 30000
restart_window_ms = 300000
stable_reset_ms = 600000
max_restarts_per_window = 5
jitter_percent = 20

[shutdown]
drain_grace_ms = 30000
cancellation_grace_ms = 10000
termination_grace_ms = 5000

[[workers]]
worker_id = "example-chat-metal-1"
bind = "127.0.0.1:9471"
binary = "metal"
credential_id = "example-chat-metal-credential-1"
bearer_token_env = "REPLACE_IZWI_WORKER_CHAT_METAL_1_TOKEN"
max_active_invocations = 1
max_request_bytes = 1048576
max_retained_attempts = 128
attempt_retention_secs = 300
streaming = true

[workers.assignment]
backend = "metal"
# Replace the suffix with the discovered Metal registry ID. The supervisor
# requires an exact identity match and will not fall back to CPU.
device_id = "metal:REPLACE_WITH_DISCOVERED_REGISTRY_ID"
process_local_device_index = 0
# Apple unified memory counts against the node host-memory budget too.
shared_memory_limit_bytes = 7516192768

[workers.deployment]
deployment_id = "example-chat-metal-v1"
public_model = "LFM2.5-1.2B-Instruct-GGUF"
artifact_revision = "REPLACE_WITH_PINNED_ARTIFACT_REVISION"
model_generation = 1
task = "chat"
backend = "metal"
precision = "gguf-q4_k_m"
execution_representation = "native-lfm2"
models_directory = "/REPLACE/WITH/IZWI_MODELS_DIRECTORY"

[workers.deployment.capability]
streaming = true
realtime = false
cancellation = "cooperative"
accepted_input_formats = ["chat_messages"]
output_formats = ["text"]
max_input_bytes = 1048576
max_context_tokens = 32
max_output_tokens = 32
