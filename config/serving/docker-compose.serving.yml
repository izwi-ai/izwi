# =============================================================================
# Izwi Audio - Separated Production Serving Topology (Gateway + Worker)
# =============================================================================
#
# Illustrates the separated production-serving architecture in Docker Compose:
#
#   Client ---> [gateway:8080] ---> [worker 127.0.0.1:9470]
#
# The gateway (`izwi-gateway`, the slim `production-gateway` image) is
# hardware-independent: it links no inference engine and never loads models.
# The worker (`izwi-serving-worker`) is an isolated process hosting
# RuntimeService, model weights, and device context.
#
# This is the single-node `standalone` gateway topology: the gateway accepts
# only numeric-loopback HTTP worker endpoints, so the gateway container shares
# the worker container's network namespace and reaches it at 127.0.0.1. The
# worker binds loopback only and is never reachable from outside that
# namespace. Splitting them across hosts is the `fleet-one-gateway` topology,
# which requires HTTPS with mutual TLS and v1 approvals (see
# docs/dev/PRODUCTION_SERVING_SINGLE_NODE_RUNBOOK.md); it is not shown here.
#
# Usage:
#   1. Set credentials in your environment or a .env file. They are required;
#      there are no defaults:
#        export GATEWAY_API_KEY="$(openssl rand -hex 32)"
#        export WORKER_BEARER_TOKEN="$(openssl rand -hex 32)"
#        export ADMIN_API_KEY="$(openssl rand -hex 32)"
#
#   2. Provision the model into the `izwi-serving-models` volume, so that
#      /app/models/LFM2.5-1.2B-Instruct-GGUF holds the pinned artifact. The
#      worker verifies its artifact and never downloads at startup.
#
#   3. Start the serving topology:
#        docker compose -f config/serving/docker-compose.serving.yml up -d
#
#   4. Test the gateway from this host:
#        curl -f http://127.0.0.1:8080/readyz
#        curl -X POST http://127.0.0.1:8080/v1/chat/completions \
#          -H "Authorization: Bearer ${GATEWAY_API_KEY}" \
#          -H "Content-Type: application/json" \
#          -d '{"model":"LFM2.5-1.2B-Instruct-GGUF","messages":[{"role":"user","content":"Hello"}]}'
#
# The gateway listens on plaintext HTTP. It is published on the host's
# loopback only; expose it beyond this host only through a TLS-terminating
# proxy, which is what IZWI_GATEWAY_TRUSTED_INGRESS_TLS=1 asserts.
#
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Worker: Private inference worker hosting the model and execution engine.
  # It owns the shared network namespace, so the gateway's published port is
  # declared here.
  # ---------------------------------------------------------------------------
  worker:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: production
    image: izwi:serving-latest
    container_name: izwi-worker-cpu
    restart: unless-stopped
    command: ["izwi-serving-worker"]
    init: true
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    # Lets in-flight inference finish before SIGKILL (Compose's default is 10 s).
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - izwi-serving-models:/app/models
    environment:
      - IZWI_WORKER_BIND=127.0.0.1:9470
      - IZWI_WORKER_MODEL=LFM2.5-1.2B-Instruct-GGUF
      - IZWI_BACKEND=cpu
      - IZWI_WORKER_CPU_THREADS=2
      - IZWI_WORKER_HOST_MEMORY_LIMIT_BYTES=2147483648
      - IZWI_CPU_MEMORY_BUDGET_BYTES=2147483648
      - IZWI_WORKER_ID=worker-cpu-1
      - IZWI_WORKER_NODE_ID=node-docker-1
      - IZWI_WORKER_DEPLOYMENT_ID=lfm25-cpu-v1
      - IZWI_WORKER_ARTIFACT_REVISION=docker-cpu-v1
      - IZWI_WORKER_MODEL_GENERATION=1
      - IZWI_WORKER_CREDENTIAL_ID=gateway-worker-key-1
      - IZWI_WORKER_BEARER_TOKEN=${WORKER_BEARER_TOKEN:?set WORKER_BEARER_TOKEN}
      - IZWI_WORKER_MAX_ACTIVE=2
      - IZWI_WORKER_MAX_REQUEST_BYTES=1048576
      - IZWI_WORKER_MAX_RETAINED_ATTEMPTS=64
      - IZWI_WORKER_ATTEMPT_RETENTION_SECS=300
      - IZWI_WORKER_STREAMING=true
      - IZWI_MODELS_DIR=/app/models
    healthcheck:
      # Reads the bearer token from the environment, never argv.
      test: ["CMD", "izwi-serving-worker", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  # ---------------------------------------------------------------------------
  # Gateway: Public-facing, hardware-independent API router. It shares the
  # worker's network namespace and reaches it over loopback.
  # ---------------------------------------------------------------------------
  gateway:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: production-gateway
    image: izwi:gateway-latest
    container_name: izwi-gateway
    restart: unless-stopped
    network_mode: "service:worker"
    init: true
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    # Above IZWI_GATEWAY_SHUTDOWN_BUDGET_SECS (Compose's default is 10 s).
    stop_grace_period: 30s
    environment:
      - IZWI_GATEWAY_API_KEY=${GATEWAY_API_KEY:?set GATEWAY_API_KEY}
      - IZWI_GATEWAY_ADMIN_API_KEY=${ADMIN_API_KEY:?set ADMIN_API_KEY}
      - IZWI_GATEWAY_ADMIN_API_KEY_REF=env:IZWI_GATEWAY_ADMIN_API_KEY
      - IZWI_GATEWAY_WORKER_CREDENTIAL_ID=gateway-worker-key-1
      - IZWI_GATEWAY_WORKER_BEARER_TOKEN=${WORKER_BEARER_TOKEN:?set WORKER_BEARER_TOKEN}
      - IZWI_GATEWAY_TRUSTED_INGRESS_TLS=1
      - IZWI_GATEWAY_PRESTOP_SECS=0
      - IZWI_GATEWAY_SHUTDOWN_BUDGET_SECS=25
    command:
      - "izwi-gateway"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "--public-model"
      - "LFM2.5-1.2B-Instruct-GGUF"
      - "--gateway-worker-approval"
      - "http://127.0.0.1:9470|chat|LFM2.5-1.2B-Instruct-GGUF|lfm25-cpu-v1|1"
      - "--gateway-max-in-flight"
      - "32"
    depends_on:
      worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "izwi-gateway", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  izwi-serving-models:
